[project]
name = "mcp-weather-query"
version = "0.1.0"
description = "A local, read-only MCP weather tool learning project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=2,<3",
    "pydantic>=2.12,<3",
]

[project.scripts]
mcp-weather-query = "mcp_weather_query.__main__:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "contract: executable specification for an approved F-001 boundary",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
