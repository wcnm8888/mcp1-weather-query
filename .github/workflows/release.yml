name: release

on:
  pull_request:
  push:
    tags:
      - "v0.1.0"

permissions:
  contents: read

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest
    env:
      MCP_WEATHER_RUN_LIVE: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.6.14"
          enable-cache: false
      - name: Install locked development environment
        run: uv sync --frozen --all-groups
      - name: Check dependency lock
        run: uv lock --check
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run lint
        run: uv run ruff check .
      - name: Run strict type checking
        run: uv run mypy
      - name: Run default offline tests
        run: uv run pytest -q --tb=short
      - name: Check patch whitespace
        run: git diff --check
      - name: Build wheel and sdist
        run: uv build --no-sources
      - name: Inspect built distributions
        run: uv run python tests/packaging/inspect_artifacts.py dist
      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distributions to production PyPI
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.1.0'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-weather-query
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
